# Docker profile. Configure runtime dependencies with environment variables.

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/social_retail_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}

upload.path=${UPLOAD_PATH:/app/uploads}
upload.base-url=${UPLOAD_BASE_URL:}
distributor.id-card-storage-path=${DISTRIBUTOR_ID_CARD_STORAGE_PATH:/app/uploads/distributor/id}

jwt.secret=${JWT_SECRET:change-me-before-production-social-retail}

alipay.app-id=${ALIPAY_APP_ID:}
alipay.private-key=${ALIPAY_PRIVATE_KEY:}
alipay.alipay-public-key=${ALIPAY_PUBLIC_KEY:}
alipay.notify-url=${ALIPAY_NOTIFY_URL:}
alipay.return-url=${ALIPAY_RETURN_URL:}
alipay.mobile-return-url=${ALIPAY_MOBILE_RETURN_URL:}
